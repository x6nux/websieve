[package]
name = "wsieve-server"
version = "0.1.0"
edition = "2021"

[dependencies]
wsieve-proto = { version = "0.1.0", path = "../wsieve-proto" }
wsieve-xhttp = { version = "0.1.0", path = "../wsieve-xhttp" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
bytes = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
snow = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
rustls-pemfile = "2"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
wsieve-mux = { version = "0.1.0", path = "../wsieve-mux" }
wsieve-transport = { version = "0.1.0", path = "../wsieve-transport" }

[dev-dependencies]
# webkit_tcp_probe 需要直接用 hyper 的 auto builder（按 ALPN 走 h1/h2）来
# 扮演 CDN 边缘；库代码本身经 axum 间接依赖 hyper，不需要直接引用。
hyper = { version = "1", features = ["server", "http1", "http2"] }
rand_chacha = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
wsieve-socks5 = { version = "0.1.0", path = "../wsieve-socks5" }
# cross_origin_spike：Rust ←→ 真实 WKWebView 的桥用 JSON 交换 fetch 结果。
serde = { workspace = true }
serde_json = "1"
