[package]
name = "wsieve-tun"
version = "0.1.0"
edition = "2021"
description = "TUN 入口与 fake-ip：netstack-smoltcp + tun-rs，含环路防线与启动顺序纪律"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
futures = { workspace = true }
bytes = { workspace = true }
# 只要 DNS 报文的**编解码**，真正的解析由阶段 3 的 Resolver 承担。
# 引 hickory-resolver 会顺带拖进一整套 DoH/DoT 栈而我们一个都用不上。
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
netstack-smoltcp = "0.2.4"
tun-rs = { version = "2.8", features = ["async", "async_framed"] }

[dev-dependencies]
etherparse = "0.21"
tokio = { version = "1", features = ["full", "test-util"] }
