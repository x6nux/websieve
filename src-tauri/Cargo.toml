[package]
name = "wsieve-app"
version = "0.1.0"
edition = "2021"
description = "websieve Tauri shell: WebViewTransport bridge + SOCKS5 wiring"

[workspace]
# standalone crate on purpose: the workspace stays pure-lib (protocol crates),
# the app references them by path.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wsieve-proto = { path = "../crates/wsieve-proto" }
wsieve-transport = { path = "../crates/wsieve-transport" }
wsieve-xhttp = { path = "../crates/wsieve-xhttp" }
wsieve-mux = { path = "../crates/wsieve-mux" }
wsieve-socks5 = { path = "../crates/wsieve-socks5" }

tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-stream = "0.1"
bytes = "1"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tauri-utils = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = true
